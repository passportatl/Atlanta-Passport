name: Quality

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tracked files for credentials
        run: node scripts/check-secrets.mjs

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Test Passport application
        run: pnpm --filter @workspace/atlanta-passport test

      - name: Test API unit suite
        run: >-
          pnpm --filter @workspace/api-server exec vitest run
          --exclude src/routes/bulk-undo-restore.test.ts
          --exclude src/routes/location-bulk-undo-restore.test.ts
          --exclude src/routes/crm-pricing.test.ts
          --exclude src/routes/staff-directory.test.ts
          --exclude src/lib/reminders.test.ts
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/passport_atl_ci

      - name: Build workspace
        run: pnpm build
        env:
          PORT: 4173
          BASE_PATH: /
