openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: visitors
    description: Passport visitor accounts
  - name: businesses
    description: Participating businesses
  - name: stamps
    description: Stamp collection
  - name: applications
    description: Partner applications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /visitors:
    post:
      operationId: createVisitor
      tags: [visitors]
      summary: Create a passport visitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVisitorInput"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visitor"

  /visitors/link:
    post:
      operationId: linkVisitor
      tags: [visitors]
      summary: Get or create the passport visitor for the signed-in account
      description: >
        Resolves the visitor linked to the authenticated Clerk session. Creates
        one from the account's profile on first sign-in. Requires a valid session.
      responses:
        "200":
          description: Linked visitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visitor"
        "401":
          description: Not authenticated

  /visitors/{id}:
    get:
      operationId: getVisitor
      tags: [visitors]
      summary: Get a visitor
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Visitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visitor"
        "404":
          description: Not found

  /visitors/{id}/stamps:
    get:
      operationId: listVisitorStamps
      tags: [stamps]
      summary: List a visitor's collected stamps
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stamps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StampList"

  /businesses:
    get:
      operationId: listBusinesses
      tags: [businesses]
      summary: List active participating businesses
      responses:
        "200":
          description: Businesses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessList"

  /businesses/{slug}:
    get:
      operationId: getBusinessBySlug
      tags: [businesses]
      summary: Get a single business by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "404":
          description: Not found

  /stamps:
    post:
      operationId: collectStamp
      tags: [stamps]
      summary: Collect a stamp for a visitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectStampInput"
      responses:
        "200":
          description: Collected (or already collected)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StampCollection"

  /applications:
    post:
      operationId: submitApplication
      tags: [applications]
      summary: Submit a partner application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitApplicationInput"
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationReceipt"
    get:
      operationId: listApplications
      tags: [applications]
      summary: List all partner applications (admin)
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationList"

  /contact:
    post:
      operationId: submitContactMessage
      tags: [contact]
      summary: Submit a contact / suggestion message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitContactMessageInput"
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactReceipt"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Visitor:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, firstName, email, createdAt]

    CreateVisitorInput:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
      required: [firstName, email]

    Business:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        category:
          type: string
        neighborhood:
          type: string
        description:
          type: string
        address:
          type: string
        image:
          type: string
          nullable: true
        stampName:
          type: string
        stampColor:
          type: string
        icon:
          type: string
        isActive:
          type: boolean
      required:
        - id
        - slug
        - name
        - category
        - neighborhood
        - description
        - address
        - stampName
        - stampColor
        - icon
        - isActive

    BusinessList:
      type: array
      items:
        $ref: "#/components/schemas/Business"

    Stamp:
      type: object
      properties:
        id:
          type: string
        visitorId:
          type: string
        businessId:
          type: string
        businessSlug:
          type: string
        stampName:
          type: string
        neighborhood:
          type: string
        category:
          type: string
        collectedAt:
          type: string
          format: date-time
      required:
        - id
        - visitorId
        - businessId
        - businessSlug
        - stampName
        - neighborhood
        - category
        - collectedAt

    StampList:
      type: array
      items:
        $ref: "#/components/schemas/Stamp"

    CollectStampInput:
      type: object
      properties:
        visitorId:
          type: string
        businessSlug:
          type: string
      required: [visitorId, businessSlug]

    StampCollection:
      type: object
      properties:
        stamp:
          $ref: "#/components/schemas/Stamp"
        alreadyCollected:
          type: boolean
      required: [stamp, alreadyCollected]

    SubmitApplicationInput:
      type: object
      properties:
        submissionType:
          type: string
          enum: [business, event]
        businessName: { type: string, minLength: 2 }
        contactName: { type: string, minLength: 2 }
        email: { type: string, format: email }
        phone: { type: string, minLength: 7 }
        website: { type: string }
        instagram: { type: string }
        category:
          type: array
          items: { type: string }
          minItems: 1
        neighborhood: { type: string, minLength: 1 }
        address: { type: string, minLength: 5 }
        package:
          type: string
          enum: [starter, featured, premier, route, custom, event]
        routeId: { type: string }
        offer: { type: string, minLength: 5 }
        prizeSponsorship: { type: string }
        nearMarta: { type: boolean }
        nearBeltline: { type: boolean }
        notes: { type: string }
        logoUrl: { type: string }
        subtitle: { type: string }
        about: { type: string }
        businessHours: { type: string }
        eventDate: { type: string }
        eventTime: { type: string }
        eventVenue: { type: string }
        eventCost: { type: string }
        eventUrl: { type: string }
      required:
        - submissionType
        - businessName
        - contactName
        - email
        - phone
        - category
        - neighborhood
        - address
        - offer

    Application:
      type: object
      properties:
        id: { type: string }
        submissionType: { type: string }
        businessName: { type: string }
        contactName: { type: string }
        email: { type: string }
        phone: { type: string }
        website: { type: string, nullable: true }
        instagram: { type: string, nullable: true }
        category:
          type: array
          items: { type: string }
        neighborhood: { type: string }
        address: { type: string }
        package: { type: string }
        routeId: { type: string, nullable: true }
        offer: { type: string }
        prizeSponsorship: { type: string, nullable: true }
        nearMarta: { type: boolean, nullable: true }
        nearBeltline: { type: boolean, nullable: true }
        notes: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        subtitle: { type: string, nullable: true }
        about: { type: string, nullable: true }
        businessHours: { type: string, nullable: true }
        eventDate: { type: string, nullable: true }
        eventTime: { type: string, nullable: true }
        eventVenue: { type: string, nullable: true }
        eventCost: { type: string, nullable: true }
        eventUrl: { type: string, nullable: true }
        emailDelivered: { type: string }
        createdAt: { type: string, format: date-time }
      required:
        - id
        - submissionType
        - businessName
        - contactName
        - email
        - phone
        - category
        - neighborhood
        - address
        - package
        - offer
        - emailDelivered
        - createdAt

    ApplicationList:
      type: array
      items:
        $ref: "#/components/schemas/Application"

    ApplicationReceipt:
      type: object
      properties:
        id: { type: string }
        emailDelivered: { type: string }
      required: [id, emailDelivered]

    SubmitContactMessageInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        topic:
          type: string
          enum: [question, suggestion, feedback, business, other]
        message: { type: string, minLength: 10 }
      required:
        - name
        - email
        - topic
        - message

    ContactReceipt:
      type: object
      properties:
        id: { type: string }
        emailDelivered: { type: string }
      required: [id, emailDelivered]
