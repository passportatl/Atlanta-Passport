openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: visitors
    description: Passport visitor accounts
  - name: businesses
    description: Participating businesses
  - name: stamps
    description: Stamp collection
  - name: redemptions
    description: Prize tier redemptions
  - name: admin
    description: Admin operations
  - name: applications
    description: Partner applications
  - name: events
    description: Event calendar and intake
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /visitors:
    post:
      operationId: createVisitor
      tags: [visitors]
      summary: Create a passport visitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVisitorInput"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visitor"

  /visitors/link:
    post:
      operationId: linkVisitor
      tags: [visitors]
      summary: Get or create the passport visitor for the signed-in account
      description: >
        Resolves the visitor linked to the authenticated Clerk session. Creates
        one from the account's profile on first sign-in. Requires a valid session.
      responses:
        "200":
          description: Linked visitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visitor"
        "401":
          description: Not authenticated

  /visitors/{id}:
    get:
      operationId: getVisitor
      tags: [visitors]
      summary: Get a visitor
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Visitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visitor"
        "404":
          description: Not found

  /visitors/{id}/stamps:
    get:
      operationId: listVisitorStamps
      tags: [stamps]
      summary: List a visitor's collected stamps
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stamps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StampList"

  /businesses:
    get:
      operationId: listBusinesses
      tags: [businesses]
      summary: List active participating businesses
      responses:
        "200":
          description: Businesses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessList"

  /businesses/{slug}:
    get:
      operationId: getBusinessBySlug
      tags: [businesses]
      summary: Get a single business by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "404":
          description: Not found

  /stamps:
    post:
      operationId: collectStamp
      tags: [stamps]
      summary: Collect a stamp for a visitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectStampInput"
      responses:
        "200":
          description: Collected (or already collected)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StampCollection"

  /redemptions:
    post:
      operationId: redeemPrize
      tags: [redemptions]
      summary: Redeem a prize tier (location-locked to Peachtree Wellness)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemPrizeInput"
      responses:
        "200":
          description: Redeemed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemPrizeResult"
        "404":
          description: Visitor or tier not found
        "409":
          description: Tier already redeemed
        "422":
          description: Too far from Peachtree Wellness, or not enough stamps

  /visitors/{id}/redemptions:
    get:
      operationId: listVisitorRedemptions
      tags: [redemptions]
      summary: List a visitor's prize redemptions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Redemptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedemptionList"

  /admin/export-qr:
    post:
      operationId: exportQrCodes
      tags: [admin]
      summary: Build and upload the QR-code Excel workbook to Google Drive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportQrInput"
      responses:
        "200":
          description: Exported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportQrResult"

  /applications:
    post:
      operationId: submitApplication
      tags: [applications]
      summary: Submit a partner application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitApplicationInput"
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationReceipt"
    get:
      operationId: listApplications
      tags: [applications]
      summary: List all partner applications (admin)
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationList"

  /events:
    get:
      operationId: listPublicEvents
      tags: [events]
      summary: List published events (public)
      parameters:
        - in: query
          name: neighborhood
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
      responses:
        "200":
          description: Published events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventRecord" }
    post:
      operationId: submitEvent
      tags: [events]
      summary: Submit an event for review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitEventInput" }
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRecord" }

  /events/past:
    get:
      operationId: listPastPublicEvents
      tags: [events]
      summary: List past events archive (public, formerly-published only)
      responses:
        "200":
          description: Past events, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventRecord" }

  /events/{id}:
    get:
      operationId: getPublicEvent
      tags: [events]
      summary: Get a single published event by id or slug
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRecord" }
        "404":
          description: Not found

  /admin/events:
    get:
      operationId: listAdminEvents
      tags: [admin]
      summary: List all events (admin, requires x-admin-key header)
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: tier
          schema: { type: string }
        - in: query
          name: source
          schema: { type: string }
        - in: query
          name: locationFilter
          schema:
            type: string
            enum: [ready, verified_address, missing_partial, unable_to_map, out_of_area, needs_location_review]
      responses:
        "200":
          description: All events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminEventRecord" }
        "401":
          description: Unauthorized

  /admin/events/summary:
    get:
      operationId: getAdminEventsSummary
      tags: [admin]
      summary: Workflow summary counts (admin, requires x-admin-key header)
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEventsSummary" }
        "401":
          description: Unauthorized

  /admin/events/reprocess-location:
    post:
      operationId: reprocessEventLocations
      tags: [admin]
      summary: Re-run location classification for all events; optionally geocode a batch (admin, requires x-admin-key header)
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReprocessLocationsInput" }
      responses:
        "200":
          description: Reprocess summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  scanned: { type: integer }
                  classified: { type: integer }
                  geocodeAttempted: { type: integer }
                  geocodeResolved: { type: integer }
                  skippedManuallyVerified: { type: integer }
                  outOfArea: { type: integer }
                  remainingNeedingGeocode: { type: integer }
                required: [scanned, classified, geocodeAttempted, geocodeResolved, skippedManuallyVerified, outOfArea, remainingNeedingGeocode]
        "401":
          description: Unauthorized

  /admin/events/{id}:
    patch:
      operationId: updateAdminEvent
      tags: [admin]
      summary: Update event workflow status and metadata (admin, requires x-admin-key header)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUpdateEventInput" }
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEventRecord" }
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /contact:
    post:
      operationId: submitContactMessage
      tags: [contact]
      summary: Submit a contact / suggestion message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitContactMessageInput"
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactReceipt"

  /visitors/{id}/preferences:
    patch:
      operationId: updateVisitorPreferences
      tags: [visitors]
      summary: Update a visitor's communication preferences (promo email consent)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVisitorPreferencesInput"
      responses:
        "200":
          description: Updated visitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visitor"

  /admin/auth/login:
    post:
      operationId: staffLogin
      tags: [admin]
      summary: Staff login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffLoginInput"
      responses:
        "200":
          description: Logged in (session cookie set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSessionInfo"

  /admin/auth/logout:
    post:
      operationId: staffLogout
      tags: [admin]
      summary: Log out the current staff session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]

  /admin/auth/me:
    get:
      operationId: getStaffMe
      tags: [admin]
      summary: Current staff session, if any
      responses:
        "200":
          description: Session info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSessionInfo"

  /admin/auth/change-password:
    post:
      operationId: staffChangePassword
      tags: [admin]
      summary: Change the current staff user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSessionInfo"

  /admin/users:
    get:
      operationId: listStaffUsers
      tags: [admin]
      summary: List staff users (never includes password hashes)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffUser"

  /admin/users/{id}:
    patch:
      operationId: updateStaffUser
      tags: [admin]
      summary: Update a staff user's email or status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffUserInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"

  /admin/audit-log:
    get:
      operationId: listAdminAuditLog
      tags: [admin]
      summary: Recent admin action history
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAuditEntry"

  /admin/settings/legacy-access:
    get:
      operationId: getLegacyAccessStatus
      tags: [admin]
      summary: Whether the legacy shared admin secret is still accepted
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyAccessStatus"
    patch:
      operationId: setLegacyAccessStatus
      tags: [admin]
      summary: Enable or disable the legacy shared admin secret (staff session required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyAccessStatus"
      responses:
        "200":
          description: Updated status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyAccessStatus"

  /admin/partners/summary:
    get:
      operationId: getPartnersSummary
      tags: [admin]
      summary: Unified partner totals across events, locations, and vendors
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnersSummary"

  /admin/crm/records:
    get:
      operationId: listCrmRecords
      tags: [admin]
      summary: Unified CRM records (events, locations, vendors, partners)
      parameters:
        - name: recordType
          in: query
          schema:
            type: string
            enum: [event, location, vendor, business]
        - name: bucket
          in: query
          description: Follow-up queue filter
          schema:
            type: string
            enum: [overdue, upcoming, unassigned, paid]
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CrmRecord"

  /admin/crm/{recordType}/{id}:
    patch:
      operationId: updateCrmRecord
      tags: [admin]
      summary: Update CRM fields on a submission record
      parameters:
        - name: recordType
          in: path
          required: true
          schema:
            type: string
            enum: [event, location, vendor, business]
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrmUpdateInput"
      responses:
        "200":
          description: Updated record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrmRecord"

  /admin/reminders/run:
    post:
      operationId: runReminderCheck
      tags: [admin]
      summary: Manually trigger the follow-up reminder check and email digest
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderRunResult"

  /admin/staff-directory:
    get:
      operationId: getStaffDirectory
      tags: [admin]
      summary: Staff directory (name -> email) used to route per-staff reminder digests
      responses:
        "200":
          description: Directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffDirectory"
    put:
      operationId: updateStaffDirectory
      tags: [admin]
      summary: Replace the staff directory (admin-editable name -> email mapping)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffDirectoryInput"
      responses:
        "200":
          description: Updated directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffDirectory"

  /admin/insights:
    get:
      operationId: getAdminInsights
      tags: [admin]
      summary: Platform insights — users, growth, engagement, stamps, rewards, events
      responses:
        "200":
          description: Insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInsights"

  /admin/newsletter-export:
    get:
      operationId: exportNewsletterCsv
      tags: [admin]
      summary: CSV export of users who explicitly opted into promotional email
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }

  /legends:
    get:
      operationId: listLegends
      tags: [legends]
      summary: List published ATL Legends
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
      responses:
        "200":
          description: Published Legends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegendSummary"

  /legends/{slug}:
    get:
      operationId: getLegend
      tags: [legends]
      summary: Get a published ATL Legend
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published Legend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Legend"
        "404":
          description: Not found

components:
  schemas:
    LegendSummary:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        subtitle: { type: string, nullable: true }
        excerpt: { type: string, nullable: true }
        category: { type: string }
        tags:
          type: array
          items: { type: string }
        authorName: { type: string, nullable: true }
        authorImage: { type: string, nullable: true }
        heroImage: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time }
        isFeatured: { type: boolean }
        readingTimeMinutes: { type: integer, nullable: true }
      required: [id, slug, title, category, tags, publishedAt, isFeatured]

    Legend:
      allOf:
        - $ref: "#/components/schemas/LegendSummary"
        - type: object
          properties:
            body: { type: string, nullable: true }
            authorBio: { type: string, nullable: true }
            galleryImages:
              type: array
              items: { type: string }
            seoTitle: { type: string, nullable: true }
            seoDescription: { type: string, nullable: true }
            socialPreviewImage: { type: string, nullable: true }
            relatedLocationSlugs:
              type: array
              items: { type: string }
            relatedEventIds:
              type: array
              items: { type: string }
            relatedRouteSlugs:
              type: array
              items: { type: string }
            relatedExperienceSlugs:
              type: array
              items: { type: string }
          required:
            - galleryImages
            - relatedLocationSlugs
            - relatedEventIds
            - relatedRouteSlugs
            - relatedExperienceSlugs

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Visitor:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        promoOptIn:
          type: boolean
        promoOptInAt:
          type: string
          format: date-time
          nullable: true
        termsAcceptedAt:
          type: string
          format: date-time
          nullable: true
        termsVersion:
          type: string
          nullable: true
        privacyAcceptedAt:
          type: string
          format: date-time
          nullable: true
        privacyVersion:
          type: string
          nullable: true
        marketingOptIn:
          type: boolean
        marketingConsentUpdatedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, firstName, email, promoOptIn, marketingOptIn, createdAt]

    CreateVisitorInput:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
      required: [firstName, email]

    Business:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
          category:
            type: string
          categoryId:
            type: string
          tags:
            type: array
            items: { type: string }
          neighborhood:
            type: string
          areaId:
            type: string
        description:
          type: string
        address:
          type: string
        image:
          type: string
          nullable: true
        stampName:
          type: string
        stampColor:
          type: string
        icon:
          type: string
        latitude:
          type: number
          nullable: true
          longitude:
            type: number
            nullable: true
          mapReadiness:
            type: string
            enum: [verified, coordinates-present, missing-coordinates]
          publicStatus: { type: string }
          isStampStop: { type: boolean }
          priorityListing: { type: boolean }
          priorityRank: { type: integer }
          detailPageEnabled: { type: boolean }
          entitlementStartsAt: { type: string, format: date-time, nullable: true }
          entitlementEndsAt: { type: string, format: date-time, nullable: true }
          hasPublicOffer: { type: boolean }
          publicUpdatedAt: { type: string, format: date-time }
          sortKey: { type: string }
          isActive:
            type: boolean
      required:
        - id
        - slug
        - name
          - category
          - categoryId
          - tags
          - neighborhood
          - areaId
        - description
        - address
        - stampName
        - stampColor
          - icon
          - mapReadiness
          - publicStatus
          - isStampStop
          - priorityListing
          - priorityRank
          - detailPageEnabled
          - hasPublicOffer
          - publicUpdatedAt
          - sortKey
          - isActive

    BusinessList:
      type: array
      items:
        $ref: "#/components/schemas/Business"

    Stamp:
      type: object
      properties:
        id:
          type: string
        visitorId:
          type: string
        businessId:
          type: string
        businessSlug:
          type: string
        stampName:
          type: string
        neighborhood:
          type: string
        category:
          type: string
        collectedAt:
          type: string
          format: date-time
      required:
        - id
        - visitorId
        - businessId
        - businessSlug
        - stampName
        - neighborhood
        - category
        - collectedAt

    StampList:
      type: array
      items:
        $ref: "#/components/schemas/Stamp"

    CollectStampInput:
      type: object
      properties:
        visitorId:
          type: string
        businessSlug:
          type: string
        latitude:
          type: number
        longitude:
          type: number
      required: [visitorId, businessSlug]

    Redemption:
      type: object
      properties:
        id:
          type: string
        visitorId:
          type: string
        tierStamps:
          type: integer
        redeemedAt:
          type: string
          format: date-time
      required: [id, visitorId, tierStamps, redeemedAt]

    RedemptionList:
      type: array
