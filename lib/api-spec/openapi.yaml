openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: visitors
    description: Passport visitor accounts
  - name: businesses
    description: Participating businesses
  - name: stamps
    description: Stamp collection
  - name: redemptions
    description: Prize tier redemptions
  - name: admin
    description: Admin operations
  - name: applications
    description: Partner applications
  - name: events
    description: Event calendar and intake
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /visitors:
    post:
      operationId: createVisitor
      tags: [visitors]
      summary: Create a passport visitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVisitorInput"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visitor"

  /visitors/link:
    post:
      operationId: linkVisitor
      tags: [visitors]
      summary: Get or create the passport visitor for the signed-in account
      description: >
        Resolves the visitor linked to the authenticated Clerk session. Creates
        one from the account's profile on first sign-in. Requires a valid session.
      responses:
        "200":
          description: Linked visitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visitor"
        "401":
          description: Not authenticated

  /visitors/{id}:
    get:
      operationId: getVisitor
      tags: [visitors]
      summary: Get a visitor
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Visitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visitor"
        "404":
          description: Not found

  /visitors/{id}/preferences:
    patch:
      operationId: updateVisitorPreferences
      tags: [visitors]
      summary: Record legal consent and update communication preferences
      description: >
        Updates the signed-in visitor's optional marketing preference. Required
        legal acceptance is recorded once with the current policy versions and
        cannot be revoked through this endpoint.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVisitorPreferencesInput"
      responses:
        "200":
          description: Updated visitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visitor"
        "400":
          description: Invalid input
        "401":
          description: Not authenticated
        "403":
          description: Visitor does not belong to the signed-in account
        "404":
          description: Visitor not found

  /visitors/{id}/stamps:
    get:
      operationId: listVisitorStamps
      tags: [stamps]
      summary: List a visitor's collected stamps
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stamps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StampList"

  /businesses:
    get:
      operationId: listBusinesses
      tags: [businesses]
      summary: List active participating businesses
      responses:
        "200":
          description: Businesses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessList"

  /businesses/{slug}:
    get:
      operationId: getBusinessBySlug
      tags: [businesses]
      summary: Get a single business by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "404":
          description: Not found

  /stamps:
    post:
      operationId: collectStamp
      tags: [stamps]
      summary: Collect a stamp for a visitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectStampInput"
      responses:
        "200":
          description: Collected (or already collected)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StampCollection"

  /redemptions:
    post:
      operationId: redeemPrize
      tags: [redemptions]
      summary: Redeem a prize tier (location-locked to Peachtree Wellness)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemPrizeInput"
      responses:
        "200":
          description: Redeemed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemPrizeResult"
        "404":
          description: Visitor or tier not found
        "409":
          description: Tier already redeemed
        "422":
          description: Too far from Peachtree Wellness, or not enough stamps

  /visitors/{id}/redemptions:
    get:
      operationId: listVisitorRedemptions
      tags: [redemptions]
      summary: List a visitor's prize redemptions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Redemptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedemptionList"

  /admin/export-qr:
    post:
      operationId: exportQrCodes
      tags: [admin]
      summary: Build and upload the QR-code Excel workbook to Google Drive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportQrInput"
      responses:
        "200":
          description: Exported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportQrResult"

  /applications:
    post:
      operationId: submitApplication
      tags: [applications]
      summary: Submit a partner application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitApplicationInput"
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationReceipt"
    get:
      operationId: listApplications
      tags: [applications]
      summary: List all partner applications (admin)
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationList"

  /events:
    get:
      operationId: listPublicEvents
      tags: [events]
      summary: List published events (public)
      parameters:
        - in: query
          name: neighborhood
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
      responses:
        "200":
          description: Published events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventRecord" }
    post:
      operationId: submitEvent
      tags: [events]
      summary: Submit an event for review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitEventInput" }
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRecord" }

  /events/past:
    get:
      operationId: listPastPublicEvents
      tags: [events]
      summary: List past events archive (public, formerly-published only)
      responses:
        "200":
          description: Past events, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventRecord" }

  /events/{id}:
    get:
      operationId: getPublicEvent
      tags: [events]
      summary: Get a single published event by id or slug
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRecord" }
        "404":
          description: Not found

  /admin/events:
    get:
      operationId: listAdminEvents
      tags: [admin]
      summary: List all events (admin, requires x-admin-key header)
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: tier
          schema: { type: string }
        - in: query
          name: source
          schema: { type: string }
        - in: query
          name: locationFilter
          schema:
            type: string
            enum:
              [
                ready,
                verified_address,
                missing_partial,
                unable_to_map,
                out_of_area,
                needs_location_review,
              ]
      responses:
        "200":
          description: All events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminEventRecord" }
        "401":
          description: Unauthorized

  /admin/events/summary:
    get:
      operationId: getAdminEventsSummary
      tags: [admin]
      summary: Workflow summary counts (admin, requires x-admin-key header)
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEventsSummary" }
        "401":
          description: Unauthorized

  /admin/events/reprocess-location:
    post:
      operationId: reprocessEventLocations
      tags: [admin]
      summary: Re-run location classification for all events; optionally geocode a batch (admin, requires x-admin-key header)
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReprocessLocationsInput" }
      responses:
        "200":
          description: Reprocess summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  scanned: { type: integer }
                  classified: { type: integer }
                  geocodeAttempted: { type: integer }
                  geocodeResolved: { type: integer }
                  skippedManuallyVerified: { type: integer }
                  outOfArea: { type: integer }
                  remainingNeedingGeocode: { type: integer }
                required:
                  [
                    scanned,
                    classified,
                    geocodeAttempted,
                    geocodeResolved,
                    skippedManuallyVerified,
                    outOfArea,
                    remainingNeedingGeocode,
                  ]
        "401":
          description: Unauthorized

  /admin/events/{id}:
    patch:
      operationId: updateAdminEvent
      tags: [admin]
      summary: Update event workflow status and metadata (admin, requires x-admin-key header)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUpdateEventInput" }
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEventRecord" }
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /contact:
    post:
      operationId: submitContactMessage
      tags: [contact]
      summary: Submit a contact / suggestion message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitContactMessageInput"
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactReceipt"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Visitor:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        termsAcceptedAt:
          type: string
          format: date-time
          nullable: true
        termsVersion:
          type: string
          nullable: true
        privacyAcceptedAt:
          type: string
          format: date-time
          nullable: true
        privacyVersion:
          type: string
          nullable: true
        marketingOptIn:
          type: boolean
        marketingConsentUpdatedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, firstName, email, marketingOptIn, createdAt]

    CreateVisitorInput:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
      required: [firstName, email]

    UpdateVisitorPreferencesInput:
      type: object
      properties:
        acceptTerms:
          type: boolean
        acceptPrivacy:
          type: boolean
        marketingOptIn:
          type: boolean
      required: [marketingOptIn]

    Business:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        category:
          type: string
        categoryId:
          type: string
        tags:
          type: array
          items:
            type: string
        neighborhood:
          type: string
        areaId:
          type: string
        description:
          type: string
        address:
          type: string
        image:
          type: string
          nullable: true
        stampName:
          type: string
        stampColor:
          type: string
        icon:
          type: string
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        mapReadiness:
          type: string
          enum: [verified, coordinates-present, missing-coordinates]
        publicStatus:
          type: string
        isStampStop:
          type: boolean
        priorityListing:
          type: boolean
        priorityRank:
          type: integer
        detailPageEnabled:
          type: boolean
        entitlementStartsAt:
          type: string
          format: date-time
          nullable: true
        entitlementEndsAt:
          type: string
          format: date-time
          nullable: true
        hasPublicOffer:
          type: boolean
        publicUpdatedAt:
          type: string
          format: date-time
        sortKey:
          type: string
        isActive:
          type: boolean
      required:
        - id
        - slug
        - name
        - category
        - categoryId
        - tags
        - neighborhood
        - areaId
        - description
        - address
        - stampName
        - stampColor
        - icon
        - mapReadiness
        - publicStatus
        - isStampStop
        - priorityListing
        - priorityRank
        - detailPageEnabled
        - hasPublicOffer
        - publicUpdatedAt
        - sortKey
        - isActive

    BusinessList:
      type: array
      items:
        $ref: "#/components/schemas/Business"

    Stamp:
      type: object
      properties:
        id:
          type: string
        visitorId:
          type: string
        businessId:
          type: string
        businessSlug:
          type: string
        stampName:
          type: string
        neighborhood:
          type: string
        category:
          type: string
        collectedAt:
          type: string
          format: date-time
      required:
        - id
        - visitorId
        - businessId
        - businessSlug
        - stampName
        - neighborhood
        - category
        - collectedAt

    StampList:
      type: array
      items:
        $ref: "#/components/schemas/Stamp"

    CollectStampInput:
      type: object
      properties:
        visitorId:
          type: string
        businessSlug:
          type: string
        latitude:
          type: number
        longitude:
          type: number
      required: [visitorId, businessSlug]

    Redemption:
      type: object
      properties:
        id:
          type: string
        visitorId:
          type: string
        tierStamps:
          type: integer
        redeemedAt:
          type: string
          format: date-time
      required: [id, visitorId, tierStamps, redeemedAt]

    RedemptionList:
      type: array
      items:
        $ref: "#/components/schemas/Redemption"

    RedeemPrizeInput:
      type: object
      properties:
        visitorId:
          type: string
        tier:
          type: integer
        latitude:
          type: number
        longitude:
          type: number
      required: [visitorId, tier]

    RedeemPrizeResult:
      type: object
      properties:
        redemption:
          $ref: "#/components/schemas/Redemption"
        effectiveBalance:
          type: integer
      required: [redemption, effectiveBalance]

    ExportQrInput:
      type: object
      properties:
        publishedOrigin:
          type: string
      required: [publishedOrigin]

    ExportQrResult:
      type: object
      properties:
        url:
          type: string
        fileName:
          type: string
      required: [url, fileName]

    StampCollection:
      type: object
      properties:
        stamp:
          $ref: "#/components/schemas/Stamp"
        alreadyCollected:
          type: boolean
      required: [stamp, alreadyCollected]

    SubmitApplicationInput:
      type: object
      properties:
        submissionType:
          type: string
          enum: [business, event]
        businessName: { type: string, minLength: 2 }
        contactName: { type: string, minLength: 2 }
        email: { type: string, format: email }
        phone: { type: string, minLength: 7 }
        website: { type: string }
        instagram: { type: string }
        category:
          type: array
          items: { type: string }
          minItems: 1
        neighborhood: { type: string, minLength: 1 }
        address: { type: string, minLength: 5 }
        package:
          type: string
          enum: [starter, featured, premier, route, custom, event]
        routeId: { type: string }
        offer: { type: string, minLength: 5 }
        prizeSponsorship: { type: string }
        nearMarta: { type: boolean }
        nearBeltline: { type: boolean }
        notes: { type: string }
        logoUrl: { type: string }
        subtitle: { type: string }
        about: { type: string }
        businessHours: { type: string }
        upcomingEvents: { type: string }
        featuredMenuItems: { type: string }
        eventDate: { type: string }
        eventTime: { type: string }
        eventVenue: { type: string }
        eventCost: { type: string }
        eventUrl: { type: string }
        promoContact: { type: boolean }
        promoContactMethod: { type: string }
      required:
        - submissionType
        - businessName
        - contactName
        - email
        - phone
        - category
        - neighborhood
        - address
        - offer

    Application:
      type: object
      properties:
        id: { type: string }
        submissionType: { type: string }
        businessName: { type: string }
        contactName: { type: string }
        email: { type: string }
        phone: { type: string }
        website: { type: string, nullable: true }
        instagram: { type: string, nullable: true }
        category:
          type: array
          items: { type: string }
        neighborhood: { type: string }
        address: { type: string }
        package: { type: string }
        routeId: { type: string, nullable: true }
        offer: { type: string }
        prizeSponsorship: { type: string, nullable: true }
        nearMarta: { type: boolean, nullable: true }
        nearBeltline: { type: boolean, nullable: true }
        notes: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        subtitle: { type: string, nullable: true }
        about: { type: string, nullable: true }
        businessHours: { type: string, nullable: true }
        upcomingEvents: { type: string, nullable: true }
        featuredMenuItems: { type: string, nullable: true }
        eventDate: { type: string, nullable: true }
        eventTime: { type: string, nullable: true }
        eventVenue: { type: string, nullable: true }
        eventCost: { type: string, nullable: true }
        eventUrl: { type: string, nullable: true }
        promoContact: { type: boolean, nullable: true }
        promoContactMethod: { type: string, nullable: true }
        emailDelivered: { type: string }
        createdAt: { type: string, format: date-time }
      required:
        - id
        - submissionType
        - businessName
        - contactName
        - email
        - phone
        - category
        - neighborhood
        - address
        - package
        - offer
        - emailDelivered
        - createdAt

    ApplicationList:
      type: array
      items:
        $ref: "#/components/schemas/Application"

    ApplicationReceipt:
      type: object
      properties:
        id: { type: string }
        emailDelivered: { type: string }
      required: [id, emailDelivered]

    SubmitContactMessageInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        topic:
          type: string
          enum:
            - general_question
            - technical_support
            - media_press
            - partnership
            - event_listing
            - location_listing
            - sponsorship
            - billing
            - other
        message: { type: string, minLength: 10 }
      required:
        - name
        - email
        - topic
        - message

    ContactReceipt:
      type: object
      properties:
        id: { type: string }
        emailDelivered: { type: string }
      required: [id, emailDelivered]

    EventRecord:
      type: object
      properties:
        id: { type: string }
        slug: { type: string, nullable: true }
        name: { type: string }
        category: { type: string }
        date: { type: string }
        dateIso: { type: string, nullable: true }
        time: { type: string, nullable: true }
        venue: { type: string }
        address: { type: string, nullable: true }
        neighborhood: { type: string }
        description: { type: string, nullable: true }
        highlights:
          type: array
          items: { type: string }
          nullable: true
        instagram:
          type: array
          items: { type: string }
          nullable: true
        cost: { type: string, nullable: true }
        url: { type: string, nullable: true }
        isFeatured: { type: boolean }
        isBonusStamp: { type: boolean }
        tier: { type: string }
        listingPackage: { type: string, nullable: true }
        workflowStatus: { type: string }
        imageUrl: { type: string, nullable: true }
        ticketUrl: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
          nullable: true
        ageCategory: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
      required:
        - id
        - name
        - category
        - date
        - venue
        - neighborhood
        - isFeatured
        - isBonusStamp
        - tier
        - createdAt

    AdminEventRecord:
      type: object
      properties:
        id: { type: string }
        slug: { type: string, nullable: true }
        name: { type: string }
        category: { type: string }
        date: { type: string }
        dateIso: { type: string, nullable: true }
        time: { type: string, nullable: true }
        venue: { type: string }
        address: { type: string, nullable: true }
        neighborhood: { type: string }
        description: { type: string, nullable: true }
        highlights:
          type: array
          items: { type: string }
          nullable: true
        instagram:
          type: array
          items: { type: string }
          nullable: true
        cost: { type: string, nullable: true }
        url: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        ticketUrl: { type: string, nullable: true }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }
        zip: { type: string, nullable: true }
        county: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        addressStatus: { type: string }
        mapReadiness: { type: string }
        outOfArea: { type: boolean }
        outOfAreaReason: { type: string, nullable: true }
        addressSource: { type: string, nullable: true }
        locationVerifiedByAdmin: { type: boolean }
        workflowStatus: { type: string }
        publishedAt: { type: string, format: date-time, nullable: true }
        scheduledPublishAt: { type: string, format: date-time, nullable: true }
        tier: { type: string }
        listingPackage: { type: string, nullable: true }
        addOns:
          type: array
          items: { type: string }
          nullable: true
        listingPrice: { type: number, nullable: true }
        isFeatured: { type: boolean }
        isBonusStamp: { type: boolean }
        contactName: { type: string, nullable: true }
        contactEmail: { type: string, nullable: true }
        contactPhone: { type: string, nullable: true }
